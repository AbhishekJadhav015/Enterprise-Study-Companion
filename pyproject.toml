[project]
name = "study-companion"
authors = [{name = "Abhishek Jadhav"}]
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastembed>=0.8.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langchain-qdrant>=1.1.0",
    "mlflow>=3.16.0",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
